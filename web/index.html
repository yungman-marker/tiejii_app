<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- 阻止 Chrome 翻译条 / Google Translate 在中文文本下画黄色下划线。
       用户实测在某些 Chrome 版本下，"账户" 等中文小标题会被自动加黄色虚线 -->
  <meta name="google" content="notranslate">
  <meta name="translate" content="no">
  <meta class="notranslate" content="notranslate">

  <!-- 强制 HTML 渲染器（Flutter 3.47 已移除 --web-renderer flag，改用此全局变量）。
       原因：云桌面访问不到外网 gstatic CDN，默认的 CanvasKit 渲染器会去拉
       www.gstatic.com/flutter-canvaskit/canvaskit.js，拉不到直接白屏。
       HTML 渲染器走 DOM/CSS，不依赖任何 CDN，本地 web 调试即可正常显示。
       （iPhone 真机有外网，可正常拉 gstatic；此设置对真机 UI 验证也无影响） -->
  <meta name="flutter-web-renderer" content="html">
  <script>
    // legacy 全局：多数 Flutter Web 版本在引擎初始化时读取此变量决定渲染器
    window.flutterWebRenderer = 'html';
  </script>

  <!-- 防御：禁用 Flutter Web 上输入区域（TextField 落地为 contenteditable）
       的浏览器拼写检查视觉装饰；普通 Text widget 的 Chrome 拼写下划线
       无法通过 CSS 关闭，但 notranslate meta 能挡住 Google 翻译引发的部分情况 -->
  <style>
    html, body, flt-glass-pane, flt-scene-host, flt-text-editing-host {
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    /* 输入框层面禁用 spell-check（对 TextField 生效，对纯 Text 无效） */
    input, textarea, [contenteditable="true"] {
      -webkit-spell-check: false;
      -moz-spell-check: false;
      spellcheck: false;
    }
    /* 屏蔽 Chrome 对 Flutter 文本节点的拼写/翻译装饰层（实验性，多数版本不生效） */
    ::part(misspelling), ::part(grammar-error) {
      text-decoration: none !important;
      color: inherit !important;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tiejii_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tiejii_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // 新 bootstrap 引导：通过 setupHook 在 initializeEngine 时强制 html 渲染器。
    // 放在 load 事件里，确保 flutterBootstrap 对象已就绪、setupHook 不被覆盖。
    window.addEventListener('load', function () {
      if (window.flutterBootstrap && typeof window.flutterBootstrap.setupHook === 'function') {
        // 已设过则保留；否则设置
      }
      window.flutterBootstrap = window.flutterBootstrap || {};
      window.flutterBootstrap.setupHook = function (engineInitializer) {
        return engineInitializer.initializeEngine({ renderer: 'html' });
      };
    });
  </script>
</body>
</html>
