# Codemagic 构建配置 —— 铁骥大模型 APP（iOS，无 Mac 场景）
#
# 适用前提（用户已确认 2026-08-31）：
#   - 本机无 Mac，仅有 iPhone 14 Pro 真机 + 免费 Apple ID（非 $99 付费）
#   - 因此走「开发签名 (development)」+ Sideloadly 侧载，7 天过期需重签
#   - 不可走 TestFlight / Ad-hoc（那需要付费 Apple Developer Program）
#
# 在 Codemagic 控制台需要做的：
#   1. 连接 GitHub 仓库（代码已 push 到 github）
#   2. Code signing → 选 "Apple Service Connect"，用你的免费 Apple ID 登录
#      （Codemagic 会自动建开发证书 + 开发描述文件；首次需你在 Apple 账号里
#       把 iPhone 14 Pro 的 UDID 登记为设备）
#   3. 构建产物 .ipa 会在 Artifacts 里下载
#   4. 本机用 Sideloadly（Windows 免费）把 .ipa 侧载到 iPhone 14 Pro

workflows:
  ios-development:
    name: iOS Development Build (free Apple ID)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 拉取依赖
        script: flutter pub get
      - name: 安装 iOS 原生依赖
        script: cd ios && pod install
      - name: 构建 IPA（开发签名，自动签名）
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      # 不自动发 TestFlight（免费账号不支持）；仅邮件/Artifacts 下载
      email:
        recipients:
          - your@email.com   # 改成你的邮箱，构建完成会收到下载链接
